<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 타입 어택 - NEON TYPER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }
        body {
            background-color: #070710;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,0,85,0.15) 0%, transparent 70%);
            top: 10%;
            left: 20%;
            z-index: -1;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }
        .bg-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0,255,255,0.15) 0%, transparent 70%);
            bottom: 10%;
            right: 20%;
            z-index: -1;
            animation: floatGlow 10s infinite alternate-reverse ease-in-out;
        }
        @keyframes floatGlow {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(40px) scale(1.1); }
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(255, 0, 128, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.25);
            max-width: 540px;
            width: 92%;
            animation: containerPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes containerPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .logo-wrapper {
            width: 100%;
            max-width: 380px;
            margin: 0 auto 5px auto;
        }
        .logo-wrapper svg {
            width: 100%;
            height: auto;
            display: block;
        }

        p {
            color: #8f8fa8;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .screen.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .tab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #8f8fa8;
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.25s;
        }
        .tab-btn:hover {
            border-color: #00ffff;
            color: #fff;
            transform: translateY(-2px);
        }
        .tab-btn.active {
            background: linear-gradient(45deg, #ff0055, #7928ca);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            transform: scale(1.02);
        }

        /* 로그인 영역 */
        .auth-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .auth-input {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .auth-input:focus {
            border-color: #00ffff;
        }
        .auth-btn-group {
            display: flex;
            gap: 6px;
        }
        .auth-sub-btn {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-btn { background: #00ffff; color: #000; }
        .signup-btn { background: rgba(255,255,255,0.2); color: #fff; }
        .auth-sub-btn:hover { filter: brightness(1.2); }

        .user-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .admin-badge {
            background: #ff0055;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 5px;
        }
        .logout-btn {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn {
            background: linear-gradient(45deg, #00ffff, #0070f3);
            border: none;
            color: #070710;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.4);
            width: 100%;
            margin-top: 5px;
            text-transform: uppercase;
        }
        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .info-panel {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
        }
        #score { color: #00ffff; }
        #statValue { color: #ff0055; }
        #combo { color: #ffe600; }
        
        .word-display {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 1px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-box {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #ff0055;
            border-radius: 12px;
            color: white;
            outline: none;
            margin-bottom: 10px;
        }

        .ranking-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.2);
            max-height: 140px;
            overflow-y: auto;
            text-align: left;
        }
        .ranking-title {
            font-weight: bold;
            text-align: center;
            margin-bottom: 6px;
            color: #ff0055;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        .admin-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin-left: 4px;
        }

        /* 상점 모달 및 스타일 */
        .shop-btn {
            background: linear-gradient(45deg, #ffe600, #ff0055);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
            width: 100%;
        }
        .shop-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .shop-modal.active {
            display: flex;
        }
        .shop-content {
            background: #141423;
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .shop-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .shop-tab-btn {
            flex: 1;
            padding: 6px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .shop-tab-btn.active {
            background: #00ffff;
            color: #000;
        }
        .shop-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .buy-btn {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .buy-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        .equip-btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
    </style>

            const userStr = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (!userStr || !password) return alert("닉네임과 비밀번호를 모두 입력하세요.");

            const email = getVirtualEmail(userStr);
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert("로그인 실패: 닉네임 또는 비밀번호를 확인해주세요.");
            } else {
                updateUIWithSession(data.session);
            }
        }

        async function handleSignUp() {
            const userStr = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (!userStr || !password) return alert("닉네임과 비밀번호를 모두 입력하세요.");

            const email = getVirtualEmail(userStr);
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                alert("회원가입 실패: " + error.message);
            } else {
                alert("🎉 회원가입 성공! [로그인] 버튼을 눌러 게임에 접속해주세요.");
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        async function checkAuthState() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateUIWithSession(session);

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                updateUIWithSession(session);
            });
        }

        function updateUIWithSession(session) {
            if (session && session.user) {
                currentUser = session.user;
                const userEmail = currentUser.email;
                username = userEmail.split('@')[0];

                isAdmin = (username.toLowerCase() === DEV_USERNAME.toLowerCase());

                // metadata 로드
                if (currentUser.user_metadata) {
                    userData.coins = currentUser.user_metadata.coins || 0;
                    userData.titles = currentUser.user_metadata.titles || ["🐣 초보"];
                    userData.equippedTitle = currentUser.user_metadata.equippedTitle || "🐣 초보";
                    userData.lastFreeDate = currentUser.user_metadata.lastFreeDate || "";
                }

                loggedOutUI.style.display = "none";
                loggedInUI.style.display = "block";
                userDisplay.textContent = username;
                titleTag.textContent = `[${userData.equippedTitle}]`;
                adminTag.style.display = isAdmin ? "inline-block" : "none";
                
                openShopBtn.style.display = "block";
                coinDisplay.textContent = userData.coins;
                modalCoinDisplay.textContent = userData.coins;
                document.getElementById('devCoinBtn').style.display = isAdmin ? "inline-block" : "none";

                startBtn.disabled = false;
                startBtn.textContent = "게임 시작하기 🚀";
            } else {
                currentUser = null;
                isAdmin = false;
                loggedOutUI.style.display = "block";
                loggedInUI.style.display = "none";
                openShopBtn.style.display = "none";
                startBtn.disabled = true;
                startBtn.textContent = "로그인 후 시작 가능 🚀";
            }
            fetchRankings();
        }

        async function saveUserData() {
            if (!currentUser) return;
            await supabaseClient.auth.updateUser({
                data: userData
            });
            coinDisplay.textContent = userData.coins;
            modalCoinDisplay.textContent = userData.coins;
            titleTag.textContent = `[${userData.equippedTitle}]`;
        }

        // 상점 모달 제어
        function openShopModal() {
            renderShopTitles();
            document.getElementById('shopModal').classList.add('active');
        }
        function closeShopModal() {
            document.getElementById('shopModal').classList.remove('active');
        }
        function switchShopTab(tab) {
            document.querySelectorAll('.shop-tab-btn').forEach(btn => btn.classList.remove('active'));
            if (tab === 'titles') {
                document.getElementById('shopTabTitle').classList.add('active');
                document.getElementById('shopTitlesView').style.display = 'block';
                document.getElementById('shopFreeView').style.display = 'none';
            } else {
                document.getElementById('shopTabFree').classList.add('active');
                document.getElementById('shopTitlesView').style.display = 'none';
                document.getElementById('shopFreeView').style.display = 'block';
            }
        }

        function renderShopTitles() {
            const container = document.getElementById('shopTitlesView');
            let html = "";

            availableTitles.forEach(item => {
                const isOwned = userData.titles.includes(item.name);
                const isEquipped = userData.equippedTitle === item.name;

                let actionBtn = "";
                if (isEquipped) {
                    actionBtn = `<span style="color:#00ffff; font-size:11px; font-weight:bold;">장착 중</span>`;
                } else if (isOwned) {
                    actionBtn = `<button class="equip-btn" onclick="equipTitle('${item.name}')">장착하기</button>`;
                } else {
                    const canAfford = userData.coins >= item.price;
                    actionBtn = `<button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="buyTitle('${item.name}', ${item.price})">구매 (💰${item.price})</button>`;
                }

                html += `
                    <div class="shop-item">
                        <span>🏷️ <strong>${item.name}</strong></span>
                        ${actionBtn}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function buyTitle(titleName, price) {
            if (userData.coins < price) return alert("코인이 부족합니다!");
            userData.coins -= price;
            userData.titles.push(titleName);
            userData.equippedTitle = titleName;
            await saveUserData();
            renderShopTitles();
            alert(`🎉 [${titleName}] 칭호를 구매하고 장착했습니다!`);
        }

        async function equipTitle(titleName) {
            userData.equippedTitle = titleName;
            await saveUserData();
            renderShopTitles();
        }

        // 오늘의 무료 뽑기 시스템
        async function claimFreeReward() {
            const today = new Date().toISOString().split('T')[0];
            if (userData.lastFreeDate === today) {
                return alert("오늘 이미 무료 보상을 받으셨습니다! 내일 다시 오세요.");
            }

            userData.lastFreeDate = today;
            const rand = Math.random() * 100;

            if (rand < 5) { // 5% 확률 희귀 칭호
                const rareTitle = "🍀 럭키 스타";
                if (!userData.titles.includes(rareTitle)) {
                    userData.titles.push(rareTitle);
                    userData.equippedTitle = rareTitle;
                    alert("🎉 [5% 대박 당첨!] 전설의 희귀 칭호 '🍀 럭키 스타'를 획득하고 장착했습니다!");
                } else {
                    userData.coins += 200;
                    alert("🎉 [5% 대박 당첨!] 칭호 중복으로 무료 200 코인이 추가 지급되었습니다!");
                }
            } else if (rand < 25) { // 20% 확률 고득점 코인
                userData.coins += 150;
                alert("🎁 축하합니다! 대박 무료 150 코인을 획득했습니다!");
            } else { // normal coin
                const giveCoins = Math.floor(Math.random() * 30) + 30; // 30 ~ 60 코인
                userData.coins += giveCoins;
                alert(`🎁 무료 코인 ${giveCoins}개를 획득했습니다!`);
            }

            await saveUserData();
            renderShopTitles();
        }

        // 개발자 코인 조정 기능
        async function devAdjustCoins() {
            if (!isAdmin) return;
            const input = prompt("설정할 코인 금액을 입력하세요:", userData.coins);
            if (input !== null && !isNaN(input)) {
                userData.coins = parseInt(input);
                await saveUserData();
                renderShopTitles();
                alert(`개발자 권한: 코인이 ${userData.coins}개로 조정되었습니다.`);
            }
        }

        async function fetchRankings() {
            const modeNames = { speed: '⚡ 스피드 러시', survive: '🛡️ 서바이벌', sentence: '📜 딥 센텐스', boss: '🐉 보스 레이드' };
            if (!supabaseClient) return;

            try {
                const { data, error } = await supabaseClient
                    .from('rankings')
                    .select('id, nickname, score')
                    .eq('mode', selectedMode)
                    .order('score', { ascending: false })
                    .limit(3);

                if (error) throw error;

                let html = `<div class="ranking-title">🏆 [${modeNames[selectedMode]}] 명예의 전당 TOP 3</div>`;
                const medals = ['🥇', '🥈', '🥉'];

                if (data && data.length > 0) {
                    data.forEach((row, index) => {
                        let adminControls = "";
                        if (isAdmin) {
                            adminControls = `
                                <span>
                                    <button class="admin-action-btn" onclick="editRank(${row.id}, '${row.nickname}', ${row.score})">✏️</button>
                                    <button class="admin-action-btn" onclick="deleteRank(${row.id}, '${row.nickname}')">🗑️</button>
                                </span>
                            `;
                        }
                        html += `
                            <div class="rank-item">
                                <span>${medals[index] || '•'} <strong>${row.nickname}</strong></span> 
                                <span>${row.score}점 ${adminControls}</span>
                            </div>`;
                    });
                } else {
                    html += `<div style="text-align:center; padding:5px; color:#aaa;">등록된 기록이 없습니다. 첫 번째 주인공이 되어보세요!</div>`;
                }

                rankingView.innerHTML = html;
            } catch (e) {
                rankingView.innerHTML = `<div class="ranking-title">🏆 [${modeNames[selectedMode]}] 기록을 불러오지 못했습니다.</div>`;
            }
        }

        async function deleteRank(id, targetName) {
            if (!isAdmin) return;
            if (confirm(`개발자 권한: '${targetName}' 님의 기록을 삭제하시겠습니까?`)) {
                const { error } = await supabaseClient.from('rankings').delete().eq('id', id);
                if (!error) { fetchRankings(); alert("삭제되었습니다."); }
            }
        }

        async function editRank(id, oldName, oldScore) {
            if (!isAdmin) return;
            const newScore = prompt(`'${oldName}' 님의 점수 수정:`, oldScore);
            if (newScore !== null && !isNaN(newScore)) {
                const { error } = await supabaseClient.from('rankings').update({ score: parseInt(newScore) }).eq('id', id);
                if (!error) { fetchRankings(); alert("수정되었습니다."); }
            }
        }

        function setMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            fetchRankings();
        }

        function goToGame() {
            if (!currentUser) return alert("로그인이 필요합니다.");

            const modeNames = { speed: '스피드 러시', survive: '서바이벌 모드', sentence: '딥 센텐스', boss: '보스 레이드' };
            welcomePlayer.textContent = `[${userData.equippedTitle}] ${username} | ${modeNames[selectedMode]}`;
            
            if (selectedMode === 'survive') {
                statLabel.textContent = "단어 제한 시간";
                statValue = 4; 
            } else if (selectedMode === 'boss') {
                statLabel.textContent = "남은 시간";
                statValue = 45; 
            } else {
                statLabel.textContent = "남은 시간";
                statValue = 30;
            }

            homeScreen.classList.remove('active');
            gameScreen.classList.add('active');

            initRound();
        }

        function goToHome() {
            clearInterval(gameInterval);
            isPlaying = false;
            isStarted = false;
            gameScreen.classList.remove('active');
            homeScreen.classList.add('active');
            fetchRankings();
        }

        function initRound() {
            score = 0;
            combo = 0;
            isPlaying = true;
            isStarted = false;
            scoreEl.textContent = score;
            comboEl.textContent = combo;
            statValueEl.textContent = statValue;
            
            inputBox.value = "";
            inputBox.focus();
            nextWord();
        }

        function startTimerIfNeeded() {
            if (!isStarted) {
                isStarted = true;
                clearInterval(gameInterval);
                gameInterval = setInterval(() => {
                    statValue--;
                    statValueEl.textContent = statValue;
                    if (statValue <= 0) {
                        endGame();
                    }
                }, 1000);
            }
        }

        function nextWord() {
            let pool = selectedMode === 'sentence' ? sentencePool : (selectedMode === 'boss' ? bossPool : wordPool);
            const randomIndex = Math.floor(Math.random() * pool.length);
            currentWord = pool[randomIndex];
            wordDisplay.textContent = currentWord;

            if (selectedMode === 'survive' && isStarted) {
                statValue = 4; 
                statValueEl.textContent = statValue;
            }
        }

        let isComposing = false;
        inputBox.addEventListener('compositionstart', () => { isComposing = true; });
        inputBox.addEventListener('compositionend', () => { 
            isComposing = false; 
            if (inputBox.value.length > 0) startTimerIfNeeded();
            checkInput(); 
        });
        inputBox.addEventListener('input', () => {
            if (!isPlaying) return;
            if (inputBox.value.length > 0) startTimerIfNeeded();
            if (!isComposing) checkInput();
        });

        function checkInput() {
            const typedValue = inputBox.value.trim();
            if (typedValue === currentWord) {
                combo++;
                let addScore = selectedMode === 'sentence' ? 30 : (selectedMode === 'boss' ? 50 : 10);
                score += addScore + (combo >= 5 ? 10 : 0);
                
                scoreEl.textContent = score;
                comboEl.textContent = combo;
                
                inputBox.value = "";
                nextWord();
            }
        }

        async function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            inputBox.value = "";
            wordDisplay.textContent = "GAME OVER 🛑";

            // 코인 보상 계산 (기본 획득 + 콤보 보너스)
            const earnedCoins = Math.floor(score / 8) + Math.floor(combo * 1.5);
            userData.coins += earnedCoins;
            await saveUserData();

            if (supabaseClient) {
                try {
                    const fullPlayerName = `[${userData.equippedTitle}] ${username}`;
                    await supabaseClient
                        .from('rankings')
                        .insert([{ nickname: fullPlayerName, score: score, mode: selectedMode }]);

                    alert(`게임 종료!\n최종 점수: ${score}점\n💰 ${earnedCoins} 코인을 획득했습니다!`);
                } catch (e) {
                    alert(`게임 종료! 점수: ${score}점 | 💰 +${earnedCoins} 코인`);
                }
            }

            setTimeout(goToHome, 1500);
        }

        fetchRankings();
        checkAuthState();
    </script>

</body>
</html>
