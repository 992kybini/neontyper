<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 타입 어택 - NEON TYPER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }
        body {
            background-color: #070710;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,0,85,0.15) 0%, transparent 70%);
            top: 10%;
            left: 20%;
            z-index: -1;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }
        .bg-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0,255,255,0.15) 0%, transparent 70%);
            bottom: 10%;
            right: 20%;
            z-index: -1;
            animation: floatGlow 10s infinite alternate-reverse ease-in-out;
        }
        @keyframes floatGlow {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(40px) scale(1.1); }
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 35, 0.8);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(255, 0, 128, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.25);
            max-width: 540px;
            width: 100%;
            animation: containerPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes containerPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff0055, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: titlePulse 3s infinite alternate;
        }
        @keyframes titlePulse {
            0% { filter: drop-shadow(0 0 2px rgba(255,0,85,0.4)); }
            100% { filter: drop-shadow(0 0 10px rgba(0,255,255,0.7)); }
        }

        p {
            color: #8f8fa8;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .screen.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .tab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #8f8fa8;
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn:hover {
            border-color: #00ffff;
            color: #fff;
            transform: translateY(-2px);
        }
        .tab-btn.active {
            background: linear-gradient(45deg, #ff0055, #7928ca);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            transform: scale(1.02);
        }

        /* 이메일 로그인 영역 */
        .auth-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .auth-input {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .auth-input:focus {
            border-color: #00ffff;
        }
        .auth-btn-group {
            display: flex;
            gap: 6px;
        }
        .auth-sub-btn {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-btn { background: #00ffff; color: #000; }
        .signup-btn { background: rgba(255,255,255,0.2); color: #fff; }
        .auth-sub-btn:hover { filter: brightness(1.2); }

        .user-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .admin-badge {
            background: #ff0055;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 5px;
        }
        .logout-btn {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .input-box, .nickname-input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #ff0055;
            border-radius: 12px;
            color: white;
            outline: none;
            margin-bottom: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #00ffff, #0070f3);
            border: none;
            color: #070710;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.4);
            width: 100%;
            margin-top: 5px;
            text-transform: uppercase;
        }
        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .info-panel {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
        }
        #score { color: #00ffff; }
        #statValue { color: #ff0055; }
        #combo { color: #ffe600; }
        
        .word-display {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 1px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ranking-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.2);
            max-height: 140px;
            overflow-y: auto;
            text-align: left;
        }
        .ranking-title {
            font-weight: bold;
            text-align: center;
            margin-bottom: 6px;
            color: #ff0055;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        .admin-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin-left: 4px;
            padding: 2px;
        }
    </style>

    <!-- Supabase SDK 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <!-- 홈 화면 -->
        <div id="homeScreen" class="screen active">
            <h1>⚡ NEON TYPER ⚡</h1>
            <p>명예의 전당 TOP 3 챌린지</p>

            <!-- 이메일 인증 관리 영역 -->
            <div class="auth-container">
                <div id="loggedOutUI">
                    <input type="email" id="emailInput" class="auth-input" placeholder="이메일 주소 입력">
                    <input type="password" id="passwordInput" class="auth-input" placeholder="비밀번호 입력">
                    <div class="auth-btn-group">
                        <button class="auth-sub-btn login-btn" onclick="handleLogin()">로그인</button>
                        <button class="auth-sub-btn signup-btn" onclick="handleSignUp()">회원가입</button>
                    </div>
                </div>
                <div id="loggedInUI" style="display: none;">
                    <div class="user-profile">
                        <span>👤 <strong id="userDisplay">사용자</strong> <span id="adminTag" class="admin-badge" style="display:none;">DEVELOPER</span></span>
                        <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
                    </div>
                </div>
            </div>
            
            <div class="ranking-box" id="rankingView">
                <div class="ranking-title">🏆 명예의 전당 TOP 3 로딩 중...</div>
            </div>

            <div class="tab-grid">
                <button class="tab-btn active" id="mode-speed" onclick="setMode('speed')">⚡ 스피드 러시<br><span style="font-size:10px; color:#aaa;">30초 극한 연타</span></button>
                <button class="tab-btn" id="mode-survive" onclick="setMode('survive')">🛡️ 서바이벌<br><span style="font-size:10px; color:#aaa;">3초 제한 타임어택</span></button>
                <button class="tab-btn" id="mode-sentence" onclick="setMode('sentence')">📜 딥 센텐스<br><span style="font-size:10px; color:#aaa;">명언 문장 타자</span></button>
                <button class="tab-btn" id="mode-boss" onclick="setMode('boss')">🐉 보스 레이드<br><span style="font-size:10px; color:#aaa;">고난도 단어 격파</span></button>
            </div>

            <input type="text" id="nicknameInput" class="nickname-input" placeholder="로그인 시 자동 적용" readonly autocomplete="off">
            <button class="btn" id="startBtn" onclick="goToGame()" disabled>로그인 후 시작 가능 🚀</button>
        </div>

        <!-- 게임 플레이 화면 -->
        <div id="gameScreen" class="screen">
            <h1 id="welcomePlayer" style="font-size: 20px;">PLAYER</h1>
            <p id="modeDesc">단어를 입력하는 순간 타이머가 시작됩니다!</p>
            
            <div class="info-panel">
                <div>점수: <span id="score">0</span></div>
                <div>콤보: <span id="combo">0</span>🔥</div>
                <div><span id="statLabel">시간</span>: <span id="statValue">30</span></div>
            </div>

            <div id="wordDisplay" class="word-display">준비...</div>
            
            <input type="text" id="inputBox" class="input-box" placeholder="첫 글자를 입력하세요" autocomplete="off">
            <button class="btn" style="background: rgba(255,255,255,0.1); color: #fff; box-shadow: none; font-size: 13px; padding: 10px;" onclick="goToHome()">메인 메뉴로 가기</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://kfpnmxgzqvcurmxjyyga.supabase.co";
        const SUPABASE_KEY = "sb_publishable_IiOTW-J-iPtliC9yKN8lSg_BqkGo_DW";
        const DEV_EMAIL = "y4794341@gmail.com"; // 개발자 전용 계정
        
        let supabaseClient = null;
        if (window.supabase && typeof window.supabase.createClient === 'function') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        const wordPool = [
            "사과", "바나나", "포도", "딸기", "수박", "참외", "복숭아", "자두", "감귤", "토마토",
            "하늘", "바다", "구름", "별빛", "달빛", "태양", "산맥", "강물", "나무", "꽃잎",
            "컴퓨터", "프로그램", "알고리즘", "데이터베이스", "네트워크", "인공지능", "머신러닝", "사이버", "보안", "클라우드"
        ];

        const sentencePool = [
            "인생은 속도가 아니라 방향이다.",
            "고통이 없으면 얻는 것도 없다.",
            "오늘 할 수 있는 일을 내일로 미루지 마라.",
            "작은 기회로부터 종종 위대한 업적이 시작된다.",
            "자신을 믿어라. 그러면 할 수 있는 길을 찾을 것이다."
        ];

        const bossPool = [
            "하이퍼리얼리즘인공지능시스템", "사이버네틱스시퀀셜알고리즘", "일렉트로닉스볼텍스프로토콜",
            "디지털트랜스포메이션엔지니어", "네트워크분산처리클러스터링"
        ];

        let currentUser = null;
        let isAdmin = false;
        let selectedMode = 'speed'; 
        let nickname = "";
        let score = 0;
        let combo = 0;
        let statValue = 30; 
        let isPlaying = false;
        let isStarted = false;
        let gameInterval;
        let currentWord = "";

        const homeScreen = document.getElementById('homeScreen');
        const gameScreen = document.getElementById('gameScreen');
        const nicknameInput = document.getElementById('nicknameInput');
        const rankingView = document.getElementById('rankingView');
        const welcomePlayer = document.getElementById('welcomePlayer');
        const startBtn = document.getElementById('startBtn');
        
        const loggedOutUI = document.getElementById('loggedOutUI');
        const loggedInUI = document.getElementById('loggedInUI');
        const userDisplay = document.getElementById('userDisplay');
        const adminTag = document.getElementById('adminTag');

        const wordDisplay = document.getElementById('wordDisplay');
        const inputBox = document.getElementById('inputBox');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const statLabel = document.getElementById('statLabel');
        const statValueEl = document.getElementById('statValue');

        // --- 이메일 로그인 / 회원가입 기능 ---
        async function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (!email || !password) return alert("이메일과 비밀번호를 모두 입력하세요.");

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert("로그인 실패: " + error.message);
            } else {
                updateUIWithSession(data.session);
            }
        }

        async function handleSignUp() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (!email || !password) return alert("이메일과 비밀번호를 모두 입력하세요.");

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                alert("회원가입 실패: " + error.message);
            } else {
                alert("회원가입 성공! 바로 로그인하여 이용해 주세요.");
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        async function checkAuthState() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateUIWithSession(session);

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                updateUIWithSession(session);
            });
        }

        function updateUIWithSession(session) {
            if (session && session.user) {
                currentUser = session.user;
                const userEmail = currentUser.email;
                nickname = userEmail.split('@')[0]; // 이메일 아이디 부분을 닉네임으로 고정

                isAdmin = (userEmail.toLowerCase() === DEV_EMAIL.toLowerCase());

                loggedOutUI.style.display = "none";
                loggedInUI.style.display = "block";
                userDisplay.textContent = nickname;
                adminTag.style.display = isAdmin ? "inline-block" : "none";
                
                nicknameInput.value = nickname;
                startBtn.disabled = false;
                startBtn.textContent = "게임 시작하기 🚀";
            } else {
                currentUser = null;
                isAdmin = false;
                loggedOutUI.style.display = "block";
                loggedInUI.style.display = "none";
                adminTag.style.display = "none";
                nicknameInput.value = "";
                startBtn.disabled = true;
                startBtn.textContent = "로그인 후 시작 가능 🚀";
            }
            fetchRankings();
        }

        // --- 명예의 전당 TOP 3 & 관리자 기능 ---
        async function fetchRankings() {
            const modeNames = { speed: '⚡ 스피드 러시', survive: '🛡️ 서바이벌', sentence: '📜 딥 센텐스', boss: '🐉 보스 레이드' };
            
            if (!supabaseClient) return;

            try {
                // 상위 3개만 정확하게 조회 (Top 3 제한)
                const { data, error } = await supabaseClient
                    .from('rankings')
                    .select('id, nickname, score')
                    .eq('mode', selectedMode)
                    .order('score', { ascending: false })
                    .limit(3);

                if (error) throw error;

                let html = `<div class="ranking-title">🏆 [${modeNames[selectedMode]}] 명예의 전당 TOP 3</div>`;
                const medals = ['🥇', '🥈', '🥉'];

                if (data && data.length > 0) {
                    data.forEach((row, index) => {
                        let adminControls = "";
                        if (isAdmin) {
                            adminControls = `
                                <span>
                                    <button class="admin-action-btn" title="점수 수정" onclick="editRank(${row.id}, '${row.nickname}', ${row.score})">✏️</button>
                                    <button class="admin-action-btn" title="삭제" onclick="deleteRank(${row.id}, '${row.nickname}')">🗑️</button>
                                </span>
                            `;
                        }
                        html += `
                            <div class="rank-item">
                                <span>${medals[index] || '•'} <strong>${row.nickname}</strong></span> 
                                <span>${row.score}점 ${adminControls}</span>
                            </div>`;
                    });
                } else {
                    html += `<div style="text-align:center; padding:5px; color:#aaa;">등록된 기록이 없습니다. 첫 번째 주인공이 되어보세요!</div>`;
                }

                rankingView.innerHTML = html;
            } catch (e) {
                rankingView.innerHTML = `<div class="ranking-title">🏆 [${modeNames[selectedMode]}] 기록을 불러오지 못했습니다.</div>`;
            }
        }

        // 관리자 전용 삭제 기능
        async function deleteRank(id, targetName) {
            if (!isAdmin) return;
            if (confirm(`개발자 권한: '${targetName}' 님의 기록을 삭제하시겠습니까?`)) {
                const { error } = await supabaseClient.from('rankings').delete().eq('id', id);
                if (error) {
                    alert("삭제 실패: " + error.message);
                } else {
                    alert("기록이 성공적으로 삭제되었습니다.");
                    fetchRankings();
                }
            }
        }

        // 관리자 전용 수정 기능
        async function editRank(id, oldName, oldScore) {
            if (!isAdmin) return;
            const newScore = prompt(`'${oldName}' 님의 점수를 수정합니다:`, oldScore);
            if (newScore !== null && !isNaN(newScore)) {
                const { error } = await supabaseClient.from('rankings').update({ score: parseInt(newScore) }).eq('id', id);
                if (error) {
                    alert("수정 실패: " + error.message);
                } else {
                    alert("점수가 수정되었습니다.");
                    fetchRankings();
                }
            }
        }

        function setMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            fetchRankings();
        }

        function goToGame() {
            if (!currentUser) return alert("로그인이 필요합니다.");

            const modeNames = { speed: '스피드 러시', survive: '서바이벌 모드', sentence: '딥 센텐스', boss: '보스 레이드' };
            welcomePlayer.textContent = `${nickname} | ${modeNames[selectedMode]}`;
            
            if (selectedMode === 'survive') {
                statLabel.textContent = "단어 제한 시간";
                statValue = 4; 
            } else if (selectedMode === 'boss') {
                statLabel.textContent = "남은 시간";
                statValue = 45; 
            } else {
                statLabel.textContent = "남은 시간";
                statValue = 30;
            }

            homeScreen.classList.remove('active');
            gameScreen.classList.add('active');

            initRound();
        }

        function goToHome() {
            clearInterval(gameInterval);
            isPlaying = false;
            isStarted = false;
            gameScreen.classList.remove('active');
            homeScreen.classList.add('active');
            fetchRankings();
        }

        function initRound() {
            score = 0;
            combo = 0;
            isPlaying = true;
            isStarted = false;
            scoreEl.textContent = score;
            comboEl.textContent = combo;
            statValueEl.textContent = statValue;
            
            inputBox.value = "";
            inputBox.focus();
            nextWord();
        }

        function startTimerIfNeeded() {
            if (!isStarted) {
                isStarted = true;
                clearInterval(gameInterval);
                gameInterval = setInterval(() => {
                    statValue--;
                    statValueEl.textContent = statValue;
                    if (statValue <= 0) {
                        endGame();
                    }
                }, 1000);
            }
        }

        function nextWord() {
            let pool = selectedMode === 'sentence' ? sentencePool : (selectedMode === 'boss' ? bossPool : wordPool);
            const randomIndex = Math.floor(Math.random() * pool.length);
            currentWord = pool[randomIndex];
            wordDisplay.textContent = currentWord;

            if (selectedMode === 'survive' && isStarted) {
                statValue = 4; 
                statValueEl.textContent = statValue;
            }
        }

        let isComposing = false;
        inputBox.addEventListener('compositionstart', () => { isComposing = true; });
        inputBox.addEventListener('compositionend', () => { 
            isComposing = false; 
            if (inputBox.value.length > 0) startTimerIfNeeded();
            checkInput(); 
        });
        inputBox.addEventListener('input', () => {
            if (!isPlaying) return;
            if (inputBox.value.length > 0) startTimerIfNeeded();
            if (!isComposing) checkInput();
        });

        function checkInput() {
            const typedValue = inputBox.value.trim();
            if (typedValue === currentWord) {
                combo++;
                let addScore = selectedMode === 'sentence' ? 30 : (selectedMode === 'boss' ? 50 : 10);
                score += addScore + (combo >= 5 ? 10 : 0);
                
                scoreEl.textContent = score;
                comboEl.textContent = combo;
                
                inputBox.value = "";
                nextWord();
            }
        }

        async function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            inputBox.value = "";
            wordDisplay.textContent = "GAME OVER 🛑";

            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('rankings')
                        .insert([{ nickname: nickname, score: score, mode: selectedMode }]);

                    if (error) throw error;
                    alert(`게임 종료! ${nickname}님의 점수(${score}점)가 수파베이스에 저장되었습니다! ⚡`);
                } catch (e) {
                    alert(`게임 종료! 최종 점수: ${score}점`);
                }
            }

            setTimeout(goToHome, 1500);
        }

        fetchRankings();
        checkAuthState();
    </script>

</body>
</html>
